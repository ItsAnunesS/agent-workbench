<!doctype html>
<html lang="__LANG__">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="theme-color"
      content="#1b1c20"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f5f4f1"
      media="(prefers-color-scheme: light)"
    />
    <title>__TITLE__ - Agent Workbench</title>
    <link rel="icon" href="data:image/svg+xml;base64,__FAVICON__" />
    <style>
      @font-face {
        font-family: OpenSans;
        src: url(data:font/woff;base64,__FONT_REGULAR__) format("woff");
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: OpenSans;
        src: url(data:font/woff;base64,__FONT_SEMIBOLD__) format("woff");
        font-weight: 600;
        font-display: swap;
      }
      html body {
        font-family: OpenSans, system-ui, sans-serif;
      }
      :root {
        color-scheme: dark light;
        --page: #1b1c20;
        --surface: #232429;
        --raised: #2a2b31;
        --border: #34353d;
        --text: #e8e9ed;
        --secondary: #bfc1cb;
        --muted: #9c9faa;
        --accent-text: #ffb17a;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--text);
        background: var(--page);
        font-synthesis: none;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 30px 42px;
        border-bottom: 1px solid var(--border);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .brand svg {
        width: 38px;
        height: 38px;
      }
      .local {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: var(--secondary);
      }
      .local::before {
        content: "";
        width: 6px;
        height: 6px;
        background: #ff791f;
        border-radius: 50%;
      }
      main {
        flex: 1;
        display: grid;
        place-items: center;
        padding: 60px 24px;
      }
      .card {
        width: min(100%, 560px);
        padding: 42px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: 0 24px 100px #0003;
      }
      .symbol {
        width: 92px;
        height: 92px;
        padding: 10px;
        border: 1px solid var(--border);
        background: #ff791f0d;
        border-radius: 24px;
        margin-bottom: 32px;
      }
      .symbol svg {
        width: 100%;
        height: 100%;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 16px;
        color: var(--accent-text);
        letter-spacing: 0.13em;
        font-size: 10px;
        font-weight: 650;
      }
      .eyebrow span {
        display: inline-block;
        width: 5px;
        height: 5px;
        background: currentColor;
        border-radius: 50%;
      }
      h1 {
        margin: 0 0 18px;
        font-size: clamp(28px, 5vw, 38px);
        line-height: 1.15;
        letter-spacing: -0.04em;
        font-weight: 600;
      }
      .description {
        margin: 0;
        color: var(--secondary);
        line-height: 1.8;
        font-size: 14px;
      }
      .next-step {
        padding: 20px;
        margin-top: 30px;
        border-radius: 12px;
        background: var(--raised);
        border: 1px solid var(--border);
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .step-number {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        flex-shrink: 0;
        border-radius: 9px;
        background: #ff791f;
        color: #271b12;
        font-weight: 700;
        font-size: 13px;
      }
      .next-step strong {
        display: block;
        font-size: 13px;
        font-weight: 600;
      }
      .next-step p {
        font-size: 12px;
        line-height: 1.6;
        color: var(--secondary);
        margin: 6px 0 0;
      }
      .privacy {
        font-size: 11px;
        line-height: 1.8;
        color: var(--muted);
        margin: 25px 0 0;
      }
      footer {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        padding: 24px 42px;
        color: var(--muted);
        font-size: 11px;
      }
      footer span:last-child {
        color: var(--secondary);
      }
      @media (max-width: 600px) {
        header {
          padding: 20px 24px;
        }
        .local {
          font-size: 10px;
        }
        main {
          padding: 35px 20px;
        }
        .card {
          padding: 28px;
          border-radius: 20px;
        }
        footer {
          padding: 20px 24px;
          flex-direction: column;
          gap: 8px;
        }
      }
      @media (prefers-color-scheme: light) {
        :root {
          --page: #f5f4f1;
          --surface: #faf9f6;
          --raised: #eeede9;
          --border: #d6d6d1;
          --text: #292c33;
          --secondary: #50545f;
          --muted: #666a75;
          --accent-text: #a54309;
        }
        .card {
          box-shadow: 0 24px 100px #292c3310;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">__LOGO__<span>agent workbench</span></div>
      <span class="local">__LOCAL__</span>
    </header>
    <main>
      <section class="card" aria-labelledby="title">
        <div class="symbol">__LOGO__</div>
        <p class="eyebrow"><span></span>__EYEBROW__</p>
        <h1 id="title">__TITLE__</h1>
        <p class="description">__DESCRIPTION__</p>
        <div class="next-step">
          <span class="step-number">__STEP_MARK__</span>
          <div>
            <strong>__STEP_TITLE__</strong>
            <p>__STEP_BODY__</p>
          </div>
        </div>
        <p class="privacy">
          __PRIVACY__
        </p>
      </section>
    </main>
    <footer>
      <span>__TAGLINE__</span
      ><span>Agent Workbench</span>
    </footer>
    <!-- prettier-ignore -->
    <script>__SCRIPT__</script>
  </body>
</html>
