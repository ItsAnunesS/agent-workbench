    :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#F5F1FA;background:#151219;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:30px 42px;border-bottom:1px solid #34283F}.brand{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;letter-spacing:-.02em}.brand svg{width:38px;height:38px}.local{display:flex;align-items:center;gap:8px;font-size:11px;color:#B9ABCC}.local::before{content:"";width:6px;height:6px;background:#FF791F;border-radius:50%}main{flex:1;display:grid;place-items:center;padding:60px 24px}.card{width:min(100%,560px);padding:42px;background:#21182F;border:1px solid #44334F;border-radius:24px;box-shadow:0 24px 100px #0003}.symbol{width:92px;height:92px;padding:10px;border:1px solid #59402F;background:#FF791F0D;border-radius:24px;margin-bottom:32px}.symbol svg{width:100%;height:100%}.eyebrow{display:flex;align-items:center;gap:8px;margin:0 0 16px;color:#FF9A54;letter-spacing:.13em;font-size:10px;font-weight:650}.eyebrow span{display:inline-block;width:5px;height:5px;background:currentColor;border-radius:50%}h1{margin:0 0 18px;font-size:clamp(28px,5vw,38px);line-height:1.15;letter-spacing:-.04em;font-weight:600}.description{margin:0;color:#C7B8D8;line-height:1.8;font-size:14px}.next-step{padding:20px;margin-top:30px;border-radius:12px;background:#2D2339;border:1px solid #41334F;display:flex;gap:14px;align-items:center}.step-number{display:grid;place-items:center;width:30px;height:30px;flex-shrink:0;border-radius:9px;background:#FF791F;color:#21182F;font-weight:700;font-size:13px}.next-step strong{display:block;font-size:13px;font-weight:600}.next-step p{font-size:12px;line-height:1.6;color:#B9ABCC;margin:6px 0 0}.privacy{font-size:11px;line-height:1.8;color:#A292B3;margin:25px 0 0}footer{display:flex;justify-content:space-between;gap:
