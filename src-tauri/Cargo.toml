[package]
name = "agent-workbench"
version = "0.8.0"
description = "A local workspace for AI conversations and coding agents"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "process"] }
tokio-util = "0.7"
futures-util = "0.3"
jsonwebtoken = "9"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
uuid = { version = "1", features = ["v4"] }
subtle = "2"
portable-pty = "0.9"
tauri-plugin-single-instance = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
