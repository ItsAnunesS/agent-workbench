name: Set up cached Docker build
description: Restore the shared builder image and dependency compilation caches
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    - name: Load cached builder image
      id: builder
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        load: true
        tags: agent-workbench-builder
        cache-from: type=gha,scope=workbench-builder
        cache-to: type=gha,scope=workbench-builder,mode=max,ignore-error=true
    - name: Restore dependency and release compilation cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          .build-cache/npm
          .build-cache/cargo/registry
          .build-cache/cargo/git
          src-tauri/target/release
          !src-tauri/target/release/bundle
        key: ${{ runner.os }}-workbench-v2-${{ steps.builder.outputs.imageid }}-${{ hashFiles('package-lock.json', 'src-tauri/Cargo.lock') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-workbench-v2-${{ steps.builder.outputs.imageid }}-${{ hashFiles('package-lock.json', 'src-tauri/Cargo.lock') }}-
          ${{ runner.os }}-workbench-v2-${{ steps.builder.outputs.imageid }}-
