name: Publish release
run-name: Publish release (${{ github.event_name == 'push' && 'auto' || inputs.bump }})

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      bump:
        description: Automatic Conventional Commits version, manual bump, or retry current version
        type: choice
        required: true
        default: auto
        options: [auto, current, patch, minor, major]

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/release' &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release): v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: release
          fetch-depth: 0
      - name: Check commit subjects
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: node scripts/check-commit.mjs --range "$BEFORE" "$(git rev-parse HEAD)"
      - uses: ./.github/actions/setup-build
      - name: Preserve publication tooling
        run: |
          mkdir -p "$RUNNER_TEMP/release-automation"
          cp scripts/publish-version.py scripts/version.py "$RUNNER_TEMP/release-automation/"
      - name: Select tagged snapshot for an explicit retry
        if: github.event_name == 'workflow_dispatch' && inputs.bump == 'current'
        run: git checkout --detach "v$(python3 scripts/version.py check)"
      - name: Install dependencies once
        run: |
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/workbench-release -e npm_config_cache=/workspace/.build-cache/npm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            agent-workbench-builder npm ci --prefer-offline --no-audit --fund=false
          python3 scripts/version.py check
      - name: Prepare version and notes
        id: version
        env:
          BUMP: ${{ github.event_name == 'push' && 'auto' || inputs.bump }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$BUMP" = auto ]; then
            docker run --rm --init \
              --user "$(id -u):$(id -g)" \
              -e HOME=/tmp/workbench-release -e GITHUB_TOKEN -e GITHUB_ACTION \
              -e GITHUB_ACTIONS -e GITHUB_REF -e GITHUB_REF_NAME -e GITHUB_EVENT_NAME \
              -v "$GITHUB_WORKSPACE:/workspace" -v "$RUNNER_TEMP:/release-output" \
              agent-workbench-builder node scripts/plan-release.mjs --plan /release-output/release-plan.json
            python3 scripts/version.py prepare --plan "$RUNNER_TEMP/release-plan.json" \
              --notes "$RUNNER_TEMP/release-notes.md" --output "$GITHUB_OUTPUT"
          else
            python3 scripts/version.py prepare --bump "$BUMP" \
              --notes "$RUNNER_TEMP/release-notes.md" --output "$GITHUB_OUTPUT"
          fi
      - name: Validate and package versioned AppImage
        if: steps.version.outputs.release == 'true'
        run: |
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/workbench-build \
            -e CARGO_HOME=/workspace/.build-cache/cargo \
            -v "$GITHUB_WORKSPACE:/workspace" \
            agent-workbench-builder bash scripts/container-build.sh --dependencies-installed
      - name: Upload verified snapshot
        if: steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-workbench-linux-${{ steps.version.outputs.source_sha }}
          path: |
            artifacts/*.AppImage
            artifacts/*.AppImage.zsync
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified version
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v$VERSION"
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            if [ "$(git rev-list -n 1 "$TAG")" != "$(git rev-parse HEAD)" ]; then
              echo "The version tag already points to another commit. Choose a new version." >&2
              exit 1
            fi
          else
            git tag -a "$TAG" -m "Agent Workbench $VERSION"
          fi
          python3 "$RUNNER_TEMP/release-automation/publish-version.py" --source "$SOURCE_SHA" --tag "$TAG"
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft.txt"; then
            if [ "$(cat "$RUNNER_TEMP/release-draft.txt")" = false ]; then
              echo "This version is already published; keeping its assets unchanged."
              exit 0
            fi
            gh release upload "$TAG" "artifacts/Agent-Workbench_${VERSION}_amd64.AppImage" \
              "artifacts/Agent-Workbench_${VERSION}_amd64.AppImage.zsync" artifacts/SHA256SUMS --clobber
          else
            gh release create "$TAG" "artifacts/Agent-Workbench_${VERSION}_amd64.AppImage" \
              "artifacts/Agent-Workbench_${VERSION}_amd64.AppImage.zsync" artifacts/SHA256SUMS \
              --verify-tag --title "Agent Workbench $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --draft
          fi
          gh release edit "$TAG" --draft=false --latest
