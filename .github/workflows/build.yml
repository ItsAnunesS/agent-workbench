name: Build

on:
  push:
    branches: [dev, release]
  pull_request:
    branches: [dev, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-commit.mjs --title-env PR_TITLE
      - name: Check commit subjects
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node scripts/check-commit.mjs --range "$BEFORE" "$AFTER"
      - name: Check release tooling
        run: |
          python3 scripts/version.py check
          python3 scripts/test-version.py
      - name: Build Docker environment
        run: docker build --tag agent-workbench-builder .
      - name: Check, test and build AppImage
        run: |
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/workbench-build \
            -e CARGO_HOME=/workspace/.build-cache/cargo \
            -v "$GITHUB_WORKSPACE:/workspace" \
            agent-workbench-builder
      - name: Upload commit build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-workbench-linux-${{ github.sha }}
          path: |
            artifacts/*.AppImage
            artifacts/*.AppImage.zsync
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
