name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, use SECURITY.md. Do not attach credentials or private project data."
  - type: input
    id: version
    attributes:
      label: App version and operating system
      placeholder: "0.7.0, Fedora, GNOME Wayland"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include what you expected and what actually happened.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Redact account information, tokens and private content.
